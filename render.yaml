# Render Blueprint — deploy with "New > Blueprint" in the Render dashboard
services:
  - type: web
    name: restaurant-order-sms
    runtime: docker
    plan: free
    envVars:
      - key: TZ
        value: America/New_York
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY_BASE64
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: WAREHOUSE_EMAIL
        sync: false
      - key: DELIVERY_SHEET_ID
        sync: false
      - key: SHEET_ID_25252
        sync: false
      - key: SHEET_ID_25248
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PHONE_NUMBER
        sync: false
      # PRODUCTS must list the Orders tab's product columns in sheet order —
      # reads are positional, so a mismatch shifts every product silently.
      # Current Orders tab layout (columns E-N):
      #   toast,4-inch,long,institutional_sandwich,dinner_rolls,hoagie,top_slice,marty,plain_marty,slider
      # Left unmanaged so a blueprint re-apply can never overwrite the live value.
      - key: PRODUCTS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: SCHEDULER_ENABLED
        value: "true"
